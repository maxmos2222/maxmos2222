<svg xmlns="http://www.w3.org/2000/svg"
  width="720"
  height="48"
  viewBox="0 0 720 48"
  role="img"
  aria-labelledby="intro-title">

  <title id="intro-title">
    Feel free to look through these Dropdowns for Information :3
  </title>

  <style>
    .message {
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      fill: #8e58d4;
      text-anchor: middle;
      animation: appear 1.3s ease-out both;
    }

    @keyframes appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .message {
        animation: none;
      }
    }
  </style>

  <text x="360" y="32" class="message">
    Feel free to look through these Dropdowns for Information :3
  </text>
</svg>