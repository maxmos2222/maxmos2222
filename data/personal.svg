<svg xmlns="http://www.w3.org/2000/svg"
  width="840"
  height="240"
  viewBox="0 0 840 240"
  role="img"
  aria-labelledby="personal-title personal-description">

  <title id="personal-title">Personal details</title>

  <desc id="personal-description">
    Nickname: Max
    Birthday: 18.11.
    Location: Italy
    Languages: Italian (native), English (a bit fluent)
  </desc>

  <defs>
    <linearGradient id="divider-shimmer" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#8e58d4" stop-opacity="0"/>
      <stop offset="35%" stop-color="#8e58d4" stop-opacity=".12"/>
      <stop offset="65%" stop-color="#b879d8" stop-opacity=".3"/>
      <stop offset="85%" stop-color="#b879d8" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8e58d4" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="divider-clip" clipPathUnits="userSpaceOnUse">
      <rect x="72" y="66" width="752" height="4"/>
      <rect x="72" y="120" width="752" height="4"/>
      <rect x="72" y="174" width="752" height="4"/>
    </clipPath>
  </defs>

  <style>
    text {
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif;
      font-weight: 400;
      fill: #8e58d4;
    }

    .label {
      font-size: 14px;
      font-weight: 600;
      fill: #dc8add;
    }

    .value {
      font-size: 14px;
    }

    .icon {
      fill: none;
      stroke: #dc8add;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-pulse {
      animation: breathe 6s ease-in-out infinite;
    }

    .pulse-2 {
      animation-delay: -1.5s;
    }

    .pulse-3 {
      animation-delay: -3s;
    }

    .pulse-4 {
      animation-delay: -4.5s;
    }

    .divider {
      fill: none;
      stroke: #8e58d4;
      stroke-opacity: .16;
    }

    .shimmer {
      fill: url(#divider-shimmer);
      animation: sweep 12s linear infinite;
      opacity: 0;
    }

    .shimmer-2 {
      animation-delay: -4s;
    }

    .shimmer-3 {
      animation-delay: -8s;
    }

    .content {
      animation: appear 1.3s ease-out both;
    }

    @keyframes appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes breathe {
      0%, 100% { opacity: .65; }
      50% { opacity: 1; }
    }

    @keyframes sweep {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      12% {
        opacity: .4;
      }
      76% {
        opacity: .4;
      }
      90%, 100% {
        transform: translateX(920px);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .content,
      .icon-pulse {
        animation: none;
      }

      .shimmer {
        display: none;
        animation: none;
      }
    }
  </style>

  <g class="content">
    <!-- Name: person -->
    <g class="icon"
      transform="translate(26 23)"
      aria-hidden="true">
      <g class="icon-pulse">
        <circle cx="14" cy="8" r="5"/>
        <path d="M4 26v-3a10 10 0 0 1 20 0v3"/>
      </g>
    </g>

    <text x="72" y="34" class="label">Nickname</text>
    <text x="72" y="55" class="value">Max</text>

    <path d="M72 68H824" class="divider"/>

    <!-- Birthday: calendar -->
    <g class="icon"
      transform="translate(26 77)"
      aria-hidden="true">
      <g class="icon-pulse pulse-2">
        <rect x="2" y="5" width="24" height="21" rx="3"/>
        <path d="
          M8 2v6
          M20 2v6
          M2 12h24
          M8 17h2
          M14 17h2
          M20 17h1
          M8 22h2
          M14 22h2
        "/>
      </g>
    </g>

    <text x="72" y="88" class="label">Birthday</text>
    <text x="72" y="109" class="value">18.11.</text>

    <path d="M72 122H824" class="divider"/>

    <!-- Location: map pin -->
    <g class="icon"
      transform="translate(26 131)"
      aria-hidden="true">
      <g class="icon-pulse pulse-3">
        <path d="
          M14 27
          C11 23 4 16 4 11
          a10 10 0 0 1 20 0
          c0 5-7 12-10 16Z
        "/>
        <circle cx="14" cy="11" r="3.5"/>
      </g>
    </g>

    <text x="72" y="142" class="label">Location</text>
    <text x="72" y="163" class="value">Italy</text>

    <path d="M72 176H824" class="divider"/>

    <!-- Languages: globe -->
    <g class="icon"
      transform="translate(26 185)"
      aria-hidden="true">
      <g class="icon-pulse pulse-4">
        <circle cx="14" cy="14" r="12"/>
        <ellipse cx="14" cy="14" rx="5" ry="12"/>
        <path d="M2 14h24 M4 7h20 M4 21h20"/>
      </g>
    </g>

    <text x="72" y="196" class="label">Languages</text>
    <text x="72" y="217" class="value">
      Italian (native), English (a bit fluent)
    </text>

    <!-- Subtle moving highlights along the divider lines. -->
    <g clip-path="url(#divider-clip)" aria-hidden="true">
      <rect
        class="shimmer"
        x="-100"
        y="67.3"
        width="100"
        height="1.4"
      />

      <rect
        class="shimmer shimmer-2"
        x="-100"
        y="121.3"
        width="100"
        height="1.4"
      />

      <rect
        class="shimmer shimmer-3"
        x="-100"
        y="175.3"
        width="100"
        height="1.4"
      />
    </g>
  </g>
</svg>